00" fill="#22282c" textLength="426" lengthAdjust="spacingAndGlyphs">I enjoy building structured, maintainable</text><text x="90" y="279" font-family="'Segoe Print','Bradley Hand','Chalkboard SE','Comic Sans MS',cursive" font-size="21" font-weight="400" fill="#22282c" textLength="384" lengthAdjust="spacingAndGlyphs">systems and continuously improving my</text><text x="90" y="308" font-family="'Segoe Print','Bradley Hand','Chalkboard SE','Comic Sans MS',cursive" font-size="21" font-weight="400" fill="#22282c" textLength="239" lengthAdjust="spacingAndGlyphs">problem-solving skills.</text><g fill="none" stroke="#22282c" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" filter="url(#r)" transform="translate(630,58) scale(0.8)"><rect x="50" y="20" width="160" height="100" rx="6"/><rect x="60" y="30" width="140" height="80" rx="3" stroke="#55626a" stroke-width="1.6"/><path d="M30 126 H230 L218 146 H42 Z"/><path d="M110 135 H150" stroke="#55626a" stroke-width="1.6"/><polyline points="108,56 90,70 108,84" stroke="#0a7cae"/><polyline points="152,56 170,70 152,84" stroke="#0a7cae"/><path d="M139 52 L121 88" stroke="#0a7cae"/><path d="M236 30 v16 M228 38 h16" stroke="#55626a" stroke-width="1.6"/></g><g transform="translate(600,198) scale(0.85)"><g transform="rotate(2 150 80)"><rect x="26" y="30" width="250" height="104" fill="#000" opacity="0.2"/><rect x="20" y="24" width="250" height="104" fill="#ffe58a"/><rect x="112" y="12" width="76" height="22" fill="#5fb9d6" opacity="0.6" transform="rotate(-3 150 23)"/><text letter-spacing="2" x="38" y="56" font-family="'Courier New',Courier,monospace" font-size="11" font-weight="700" fill="#3b3208" textLength="85" lengthAdjust="spacingAndGlyphs">CURRENT FOCUS</text><text x="38" y="88" font-family="'Segoe Print','Bradley Hand','Chalkboard SE','Comic Sans MS',cursive" font-size="26" font-weight="700" fill="#3b3208" textLength="206" lengthAdjust="spacingAndGlyphs">Backend API design</text><text x="38" y="116" font-family="'Segoe Print','Bradley Hand','Chalkboard SE','Comic Sans MS',cursive" font-size="26" font-weight="700" fill="#3b3208" textLength="150" lengthAdjust="spacingAndGlyphs">System design</text></g></g></g><circle cx="36" cy="13" r="5.5" fill="#0f1417" opacity="0.85"/><rect x="14" y="10.5" width="44" height="9" rx="5" fill="#000" opacity="0.3"/><rect x="14" y="8.5" width="44" height="9" rx="5" fill="url(#coil)"/><circle cx="36" cy="39" r="5.5" fill="#0f1417" opacity="0.85"/><rect x="14" y="36.5" width="44" height="9" rx="5" fill="#000" opacity="0.3"/><rect x="14" y="34.5" width="44" height="9" rx="5" fill="url(#coil)"/><circle cx="36" cy="65" r="5.5" fill="#0f1417" opacity="0.85"/><rect x="14" y="62.5" width="44" height="9" rx="5" fill="#000" opacity="0.3"/><rect x="14" y="60.5" width="44" height="9" rx="5" fill="url(#coil)"/><circle cx="36" cy="91" r="5.5" fill="#0f1417" opacity="0.85"/><rect x="14" y="88.5" width="44" height="9" rx="5" fill="#000" opacity="0.3"/><rect x="14" y="86.5" width="44" height="9" rx="5" fill="url(#coil)"/><circle cx="36" cy="117" r="5.5" fill="#0f1417" opacity="0.85"/><rect x="14" y="114.5" width="44" height="9" rx="5" fill="#000" opacity="0.3"/><rect x="14" y="112.5" width="44" height="9" rx="5" fill="url(#coil)"/><circle cx="36" cy="143" r="5.5" fill="#0f1417" opacity="0.85"/><rect x="14" y="140.5" width="44" height="9" rx="5" fill="#000" opacity="0.3"/><rect x="14" y="138.5" width="44" height="9" rx="5" fill="url(#coil)"/><circle cx="36" cy="169" r="5.5" fill="#0f1417" opacity="0.85"/><rect x="14" y="166.5" width="44" height="9" rx="5" fill="#000" opacity="0.3"/><rect x="14" y="164.5" width="44" height="9" rx="5" fill="url(#coil)"/><circle cx="36" cy="195" r="5.5" fill="#0f1417" opacity="0.85"/><rect x="14" y="192.5" width="44" height="9" rx="5" fill="#000" opacity="0.3"/><rect x="14" y="190.5" width="44" height="9" rx="5" fill="url(#coil)"/><circle cx="36" cy="221" r="5.5" fill="#0f1417" opacity="0.85"/><rect x="14" y="218.5" width="44" height