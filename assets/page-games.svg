</defs><defs><clipPath id="clip"><rect x="0" y="0" width="892" height="350" rx="8"/></clipPath></defs><rect x="6" y="8" width="892" height="350" rx="8" fill="#000" opacity="0.18"/><g clip-path="url(#clip)"><rect width="892" height="350" fill="#fbfcfa"/><rect width="892" height="350" fill="url(#dots)"/><text x="90" y="68" font-family="'Segoe Print','Bradley Hand','Chalkboard SE','Comic Sans MS',cursive" font-size="44" font-weight="700" fill="#22282c" textLength="130" lengthAdjust="spacingAndGlyphs">Games</text><path d="M86 80 Q155.0 74 224 78" fill="none" stroke="#0a7cae" stroke-width="4" stroke-linecap="round" filter="url(#r)"/><text x="850" y="62" font-family="'Segoe Print','Bradley Hand','Chalkboard SE','Comic Sans MS',cursive" font-size="22" font-weight="700" fill="#cf4437" text-anchor="end" transform="rotate(-2 850 62)" textLength="216" lengthAdjust="spacingAndGlyphs">built from scratch</text><text x="90" y="108" font-family="'Courier New',Courier,monospace" font-size="13" font-weight="400" fill="#22282c" textLength="382" lengthAdjust="spacingAndGlyphs">No game engines. Pure TypeScript and HTML Canvas.</text><g transform="rotate(-0.4 213.0 211.0)"><rect x="93" y="140" width="246" height="150" rx="7" fill="#000" opacity="0.08"/><rect x="90" y="136" width="246" height="150" rx="7" fill="#fbfcfa"/><rect x="90" y="136" width="246" height="150" rx="7" fill="none" stroke="#55626a" stroke-width="2" filter="url(#r)"/></g><text x="108" y="170" font-family="'Segoe Print','Bradley Hand','Chalkboard SE','Comic Sans MS',cursive" font-size="26" font-weight="700" fill="#22282c" textLength="66" lengthAdjust="spacingAndGlyphs">Snake</text><text x="108" y="198" font-family="'Segoe Print','Bradley Hand','Chalkboard SE','Comic Sans MS',cursive" font-size="17" font-weight="400" fill="#22282c" textLength="121" lengthAdjust="spacingAndGlyphs">Classic snake.</text><text x="108" y="220" font-family="'Segoe Print','Bradley Hand','Chalkboard SE','Comic Sans MS',cursive" font-size="17" font-weight="400" fill="#22282c" textLength="200" lengthAdjust="spacingAndGlyphs">Eat, grow, don’t crash.</text><text x="108" y="246" font-family="'Courier New',Courier,monospace" font-size="12" font-weight="400" fill="#55626a" textLength="172" lengthAdjust="spacingAndGlyphs">TypeScript · HTML Canvas</text><text x="108" y="262" font-family="'Courier New',Courier,monospace" font-size="12" font-weight="400" fill="#55626a" textLength="50" lengthAdjust="spacingAndGlyphs">Angular</text><g transform="rotate(0.4 479.0 211.0)"><rect x="359" y="140" width="246" height="150" rx="7" fill="#000" opacity="0.08"/><rect x="356" y="136" width="246" height="150" rx="7" fill="#fbfcfa"/><rect x="356" y="136" width="246" height="150" rx="7" fill="none" stroke="#55626a" stroke-width="2" filter="url(#r)"/></g><text x="374" y="170" font-family="'Segoe Print','Bradley Hand','Chalkboard SE','Comic Sans MS',cursive" font-size="26" font-weight="700" fill="#22282c" textLength="118" lengthAdjust="spacingAndGlyphs">Mario Run</text><text x="374" y="198" font-family="'Segoe Print','Bradley Hand','Chalkboard SE','Comic Sans MS',cursive" font-size="17" font-weight="400" fill="#22282c" textLength="95" lengthAdjust="spacingAndGlyphs">Platformer.</text><text x="374" y="220" font-family="'Segoe Print','Bradley Hand','Chalkboard SE','Comic Sans MS',cursive" font-size="17" font-weight="400" fill="#22282c" textLength="234" lengthAdjust="spacingAndGlyphs">Jump, stomp, collect coins.</text><text x="374" y="246" font-family="'Courier New',Courier,monospace" font-size="12" font-weight="400" fill="#55626a" textLength="172" lengthAdjust="spacingAndGlyphs">TypeScript · HTML Canvas</text><text x="374" y="262" font-family="'Courier New',Courier,monospace" font-size="12" font-weight="400" fill="#55626a" textLength="50" lengthAdjust="spacingAndGlyphs">Angular</text><g transform="rotate(-0.4 745.0 211.0)"><rect x="625" y="140" width="246" height="150" rx="7" fill="#000" opacity="0.08"/><rect x="622" y="136" width="246" h