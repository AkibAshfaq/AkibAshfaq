<head>

<title>Akib Ashfaq Portfolio</title>

<style>
:root{--desk:#d5dbde;--ink:#22282c;--soft:#55626a;--accent:#0a7cae;--paper:#fbfcfa;--line:#9aa6ac;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--desk:#101517;--ink:#e9eff1;--soft:#a3b0b6;--accent:#52c6ee;--paper:#1c2226;--line:#52616a;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:var(--desk);color:var(--ink);font-family:'Patrick Hand','Segoe Print','Comic Sans MS',cursive;font-size:18px;line-height:1.4;display:grid;place-items:center;padding:24px 16px}
.wrap{width:min(100%,960px)}
.viewport{position:relative;overflow:hidden;border-radius:8px;box-shadow:6px 8px 0 rgba(0,0,0,.18);touch-action:pan-y;user-select:none;-webkit-user-select:none;background:var(--paper)}
.viewport:focus-visible{outline:3px solid var(--accent);outline-offset:4px}
.track{display:flex;transition:transform .8s cubic-bezier(.65,0,.35,1);will-change:transform}
.track.drag{transition:none}
.track>svg{flex:0 0 100%;width:100%;height:auto;display:block}
.binding{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.controls{display:grid;grid-template-columns:104px minmax(0,1fr) 104px;align-items:center;gap:16px;margin-top:22px}
.controls>.btn{width:104px;justify-content:center}
.btn{font:700 21px/1 'Caveat','Segoe Print',cursive;color:var(--ink);background:transparent;border:2px solid currentColor;border-radius:12px 5px 14px 6px/6px 14px 5px 12px;padding:8px 16px 7px;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:6px}
.btn:hover{background:var(--ink);color:var(--desk)}
.btn:focus-visible,.dot:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
.mid{display:flex;flex-direction:column;align-items:center;gap:10px;min-width:0}
#pause{min-width:96px;justify-content:center}
.dots{display:flex;gap:8px}
.dot{width:14px;height:14px;border-radius:50%;border:2px solid var(--ink);background:transparent;padding:0;cursor:pointer}
.dot[aria-current="true"]{background:var(--ink)}
.status{margin:0;height:14px;max-width:100%;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font:400 14px/1 'Courier Prime','Courier New',monospace;color:var(--soft);letter-spacing:.08em}
.links{display:flex;flex-wrap:wrap;align-content:flex-start;gap:10px;margin-top:22px;min-height:46px}
.links .btn{color:var(--accent);font-size:20px}
.links .btn:hover{background:var(--accent);color:var(--desk)}
.hint{margin:18px 0 0;color:var(--soft);font-size:16px}
@media (max-width:560px){.controls{grid-template-columns:1fr 1fr;grid-template-areas:"mid mid" "prev next"}.mid{grid-area:mid}#prev{grid-area:prev;justify-self:start}#next{grid-area:next;justify-self:end}}
@media (prefers-reduced-motion:reduce){.track{transition:none}}
</style>
</head>

    drag = { x: e.clientX, dx: 0, id: e.pointerId };
    touched();
    try { vp.setPointerCapture(e.pointerId); } catch (err) {}
  });
  vp.addEventListener('pointermove', function (e) {
    if (!drag) return;
    drag.dx = e.clientX - drag.x;
    track.classList.add('drag');
    track.style.transform = 'translateX(calc(' + (-cur * 100) + '% + ' + drag.dx + 'px))';
  });
  function end() {
    if (!drag) return;
    var dx = drag.dx, w = vp.clientWidth;
    drag = null;
    touched();
    track.classList.remove('drag');
    if (Math.abs(dx) > w * 0.15) go(cur + (dx < 0 ? 1 : -1)); else render();
  }
  vp.addEventListener('pointerup', end);
  vp.addEventListener('pointercancel', end);

  setInterval(function () {
    if (userPaused || hovering || drag || document.hidden) return;
    if (Date.now() - lastTouch < 8000) return;
    go(cur + 1);
  }, 4500);

  render();
  reserveLinks();
  var rt = null;
  window.addEventListener('resize', function () { clearTimeout(rt); rt = setTimeout(reserveLinks, 150); });
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(reserveLinks);
})();
</script>
